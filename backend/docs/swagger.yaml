        type: string
      title:
        type: string
      user_id:
        description: telegram_id
        type: integer
    type: object
  telegramshop_backend_internal_models.CreateOrder:
    properties:
      delivery_address:
        type: string
      items:
        items:
          properties:
            product_id:
              type: string
            quantity:
              type: integer
          type: object
        type: array
      user_id:
        description: telegram_id
        type: integer
    type: object
  telegramshop_backend_internal_models.CreateUser:
    properties:
      first_name:
        type: string
      last_name:
        type: string
      phone:
        type: string
      telegram_id:
        type: integer
      username:
        type: string
    type: object
  telegramshop_backend_internal_models.Firm:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  telegramshop_backend_internal_models.ImageInput:
    properties:
      image:
        example: https://example.com/image.jpg
        type: string
    type: object
  telegramshop_backend_internal_models.ImagesInput:
    properties:
      images:
        items:
          type: string
        type: array
    type: object
  telegramshop_backend_internal_models.Product:
    properties:
      category_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      firm_id:
        type: string
      id:
        type: string
      image_gallery:
        items:
          type: integer
        type: array
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price_kopeks:
        type: integer
      stock_quantity:
        type: integer
    type: object
  telegramshop_backend_internal_models.ProductPriceTier:
    properties:
      created_at:
        type: string
      id:
        type: string
      min_quantity:
        type: integer
      price_kopeks:
        type: integer
      product_id:
        type: string
    type: object
  telegramshop_backend_internal_models.StockInput:
    properties:
      stock:
        type: integer
    type: object
  telegramshop_backend_internal_models.UpdateCategoryInput:
    properties:
      image_url:
        type: string
      name:
        type: string
      parent_id:
        type: string
    type: object
  telegramshop_backend_internal_models.UpdateFirmInput:
    properties:
      name:
        type: string
    type: object
  telegramshop_backend_internal_models.UpdateOrderStatus:
    properties:
      status:
        type: string
    type: object
  telegramshop_backend_internal_models.UpdatePriceTierInput:
    properties:
      min_quantity:
        type: integer
      price_kopeks:
        type: integer
    type: object
  telegramshop_backend_internal_models.UpdateProductInput:
    properties:
      category_id:
        type: string
      description:
        type: string
      firm_id:
        type: string
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price_kopeks:
        type: integer
      stock_quantity:
        type: integer
    type: object
  telegramshop_backend_internal_models.UpdateTierMinQuantity:
    properties:
      new_min_quantity:
        example: 5
        type: integer
    type: object
  telegramshop_backend_internal_models.UpdateUserProfile:
    properties:
      delivery_address:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      phone:
        type: string
      username:
        type: string
    type: object
  telegramshop_backend_internal_models.UpsertReviewInput:
    properties:
      comment:
        type: string
      product_id:
        type: string
      rating:
        type: integer
      user_id:
        description: telegram_id
        type: integer
    type: object
  telegramshop_backend_pkg_web.Response:
    properties:
      data: {}
      status:
        type: string
    type: object
