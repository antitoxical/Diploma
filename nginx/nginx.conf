# Docker Compose changes container IPs when services are recreated. Plain
# "upstream { server name:port }" resolves the name once at startup, which
# causes 502 "Host is unreachable" until nginx is restarted. Using the
# embedded DNS resolver + variables forces periodic re-resolution (see valid=).

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    # Мини-приложение Telegram грузится во фрейме с web.telegram.org — запрет SAMEORIGIN ломает открытие из бота.
    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://telegram.org https://webk.telegram.org https://oauth.telegram.org" always;

    # API → backend
    location /api/ {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger → backend
    location /swagger/ {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8080;
        proxy_set_header Host $host;
    }

    # Prometheus UI
    location /prometheus/ {
        set $prom_upstream prometheus;
        proxy_pass http://$prom_upstream:9090/;
        proxy_set_header Host $host;
    }

    # Backend metrics (for Prometheus scraping, also accessible via proxy)
    location /metrics {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8080;
    }

    # Прокси для картинок с placehold.co — те же origin, что и WebApp (Telegram WebView часто режет внешние хосты).
    location /ext-img/ {
        proxy_pass https://placehold.co/;
        proxy_ssl_server_name on;
        proxy_set_header Host placehold.co;
    }

    # Everything else → Telegram mini-app static frontend
    location / {
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
